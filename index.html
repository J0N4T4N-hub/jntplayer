<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080808"><title>JNT Player</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#080808;--card:#181818;--c2:#242424;--t:#fff;--s:#9a9a9a;--sa:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%;background:var(--bg);color:var(--t);font:15px/1.3 system-ui,-apple-system,Roboto,sans-serif;overflow:hidden}
button{background:none;border:0;color:inherit;font:inherit;cursor:pointer;display:grid;place-items:center}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.f{fill:currentColor;stroke:none}
#main{position:fixed;inset:0;overflow-y:auto;padding:calc(var(--sa) + 18px) 16px calc(150px + var(--sb));animation:in .35s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
h1{font-size:28px;font-weight:700;margin-bottom:18px}h2{font-size:19px;margin:26px 0 12px}
.sub{color:var(--s);font-size:13px}.row2{display:flex;justify-content:space-between;align-items:center}
.hs{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.card{flex:0 0 130px;background:var(--card);border-radius:10px;padding:10px;transition:transform .15s,background .2s}
.card:active{transform:scale(.96);background:var(--c2)}
.card .cv{width:100%;aspect-ratio:1;border-radius:6px;margin-bottom:8px}
.card.r .cv{border-radius:50%}.card.r{text-align:center}
.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv{background:var(--c2);display:grid;place-items:center;overflow:hidden;color:#555}.cv img{width:100%;height:100%;object-fit:cover}
.song{display:flex;align-items:center;gap:12px;padding:8px 4px;border-radius:8px;transition:background .2s}
.song:active{background:var(--card)}.song .cv{width:48px;height:48px;border-radius:6px;flex:none}
.song .i{flex:1;min-width:0}.song.on .n{color:#fff;font-weight:700}
.chips{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.chip{padding:7px 14px;border-radius:99px;background:var(--card);color:var(--s);transition:.2s;white-space:nowrap}.chip.a{background:#fff;color:#000}
input[type=search],.in{width:100%;background:var(--card);border:0;border-radius:10px;padding:13px 14px;color:#fff;font:inherit;outline:0;margin-bottom:14px}
.btn{background:#fff;color:#000;padding:12px 22px;border-radius:99px;font-weight:700;display:inline-block;margin:6px 0}
.btn.g{background:var(--card);color:#fff}
.empty{text-align:center;color:var(--s);padding:60px 20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .card{flex:auto}
#mini{position:fixed;left:8px;right:8px;bottom:calc(64px + var(--sb));background:var(--c2);border-radius:12px;display:flex;align-items:center;gap:10px;padding:8px;transform:translateY(0);transition:.3s;box-shadow:0 4px 20px #000a;overflow:hidden}
#mini.h{transform:translateY(140%);pointer-events:none}
#mini .cv{width:44px;height:44px;border-radius:6px;flex:none}#mini .i{flex:1;min-width:0}
#mini .bar{position:absolute;left:0;bottom:0;height:2px;background:#fff;width:0}
#nav{position:fixed;left:0;right:0;bottom:0;height:calc(64px + var(--sb));padding-bottom:var(--sb);background:linear-gradient(transparent,#080808 35%);display:flex}
#nav button{flex:1;gap:3px;color:var(--s);font-size:11px;transition:color .2s}#nav button.a{color:#fff}#nav svg{width:25px;height:25px}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px;margin-right:6px}.eq i{width:3px;background:#fff;animation:eq .9s infinite ease-in-out;height:3px}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
.pa .eq i{animation-play-state:paused}@keyframes eq{50%{height:12px}}
#full{position:fixed;inset:0;background:linear-gradient(#2a2a2a,#080808 60%);transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.8,.2,1);padding:calc(var(--sa) + 14px) 24px calc(var(--sb) + 24px);display:flex;flex-direction:column;z-index:5}
#full.o{transform:none}
#full .big{width:100%;max-width:340px;aspect-ratio:1;border-radius:12px;margin:auto;box-shadow:0 20px 60px #000c;transition:transform .5s}
#full.pa .big{transform:scale(.88)}
.ctr{display:flex;justify-content:space-between;align-items:center;margin:8px 0}
.ctr button{padding:10px;color:var(--s)}.ctr button.a{color:#fff}
.pp{background:#fff!important;color:#000!important;width:66px;height:66px;border-radius:50%;padding:0!important}.pp svg{width:30px;height:30px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;background:linear-gradient(90deg,#fff var(--p,0%),#3a3a3a var(--p,0%));outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff}
#sheet{position:fixed;inset:0;background:#000a;z-index:9;display:none;align-items:flex-end}#sheet.o{display:flex}
#sheet>div{background:var(--card);width:100%;border-radius:18px 18px 0 0;padding:18px 16px calc(var(--sb) + 18px);max-height:70%;overflow:auto;animation:in .3s}
#sheet .song{padding:12px 4px}
</style></head><body>
<div id="main"></div>
<div id="mini" class="h"><div class="cv" id="mc"></div><div class="i" id="mi" style="min-width:0"></div>
<button id="mf"></button><button id="mp"></button><div class="bar" id="mb"></div></div>
<div id="nav"></div>
<div id="full"><div class="row2"><button id="fc"></button><span class="sub">Tocando agora</span><button id="fq"></button></div>
<div class="cv big" id="fcv"></div>
<div class="row2"><div style="min-width:0"><div class="t" id="ft" style="font-size:22px;font-weight:700"></div><div class="t sub" id="fa" style="font-size:16px"></div></div><button id="ff"></button></div>
<div style="margin-top:14px"><input type="range" id="seek" value="0" max="1000"><div class="row2 sub" style="margin-top:6px"><span id="tc">0:00</span><span id="td">0:00</span></div></div>
<div class="ctr"><button id="sh"></button><button id="pv"></button><button id="fp" class="pp"></button><button id="nx"></button><button id="rp"></button></div>
<div class="row2" style="gap:12px;margin-top:6px"><span class="sub" id="vi"></span><input type="range" id="vol" min="0" max="100" value="100"></div></div>
<div id="sheet"></div>
<input type="file" id="pick" accept="audio/*,.mp3,.m4a,.flac,.ogg,.wav,.opus" multiple hidden>
<audio id="au" preload="auto"></audio>
<script>
const $=id=>document.getElementById(id),au=$('au');
const P={play:'M7 4.5v15l12-7.5z',pause:'M6 4h4v16H6zM14 4h4v16h-4z',next:'M5 5l10 7-10 7zM17 5h2v14h-2z',prev:'M19 5L9 12l10 7zM5 5h2v14H5z',
home:'M4 11l8-7 8 7v9h-5v-6H9v6H4z',search:'M11 4a7 7 0 100 14 7 7 0 000-14zM21 21l-5-5',lib:'M5 4v16M10 4v16M15 5l5 14',list:'M4 6h12M4 12h12M4 18h7M18 14v7M14.5 17.5h7',
heart:'M12 20s-8-5-8-11a4.5 4.5 0 018-2.5A4.5 4.5 0 0120 9c0 6-8 11-8 11z',plus:'M12 5v14M5 12h14',down:'M6 9l6 6 6-6',
shuffle:'M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5',repeat:'M17 2l4 4-4 4M3 11V9a3 3 0 013-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 01-3 3H3',
dots:'M12 5h.01M12 12h.01M12 19h.01',note:'M9 18V6l10-2v12M9 18a3 3 0 11-6 0 3 3 0 016 0zM19 16a3 3 0 11-6 0 3 3 0 016 0z',back:'M15 5l-7 7 7 7',refresh:'M4 12a8 8 0 0114-5l2 2M20 4v5h-5M20 12a8 8 0 01-14 5l-2-2M4 20v-5h5'};
const ic=(n,f)=>`<svg viewBox="0 0 24 24" class="${f?'f':''}"><path d="${P[n]}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>isFinite(t)&&t>0?Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0'):'0:00';
let S=[],byId={},st={fav:[],pl:{},rec:[]},tab='home',sub=null,libTab='m',sort='t',q='',Q=[],X=-1,shuf=false,rep=0,url=null,drag=false;
try{st=Object.assign(st,JSON.parse(localStorage.getItem('vibe')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('vibe',JSON.stringify(st))}catch(e){}};
/* ---------- IndexedDB ---------- */
let db;const idb=()=>new Promise(r=>{const o=indexedDB.open('vibe',1);o.onupgradeneeded=()=>o.result.createObjectStore('s',{keyPath:'id'});o.onsuccess=()=>{db=o.result;r()};o.onerror=()=>r()});
const dbAll=()=>new Promise(r=>{if(!db)return r([]);const q=db.transaction('s').objectStore('s').getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>r([])});
const dbPut=x=>{try{db.transaction('s','readwrite').objectStore('s').put(x)}catch(e){}};
/* ---------- ID3 ---------- */
const txt=d=>{const e=d[0];return new TextDecoder(e==0?'iso-8859-1':e==3?'utf-8':e==1?'utf-16':'utf-16be').decode(d.subarray(1)).replace(/\0/g,'').trim()};
async function tags(f){const r={};try{const b=new Uint8Array(await f.slice(0,3e6).arrayBuffer());
if(b[0]!=73||b[1]!=68||b[2]!=51)return r;const v=b[3],sy=(o)=>((b[o]&127)<<21)|((b[o+1]&127)<<14)|((b[o+2]&127)<<7)|(b[o+3]&127);
const end=Math.min(sy(6)+10,b.length);let p=10;
while(p+10<end){const id=String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);if(!/^[A-Z0-9]{4}$/.test(id))break;
const l=v==4?sy(p+4):(b[p+4]*16777216+(b[p+5]<<16)+(b[p+6]<<8)+b[p+7]);const d=b.subarray(p+10,p+10+l);p+=10+l;if(!d.length)continue;
if(id=='TIT2')r.title=txt(d);else if(id=='TPE1')r.artist=txt(d);else if(id=='TALB')r.album=txt(d);
else if(id=='APIC'&&!r.cover){const e=d[0];let i=1;while(d[i])i++;i+=2;if(e==1||e==2){while(i<d.length&&(d[i]||d[i+1]))i+=2;i+=2}else{while(d[i])i++;i++}
const im=d.subarray(i);if(im.length>100)r.cover=new Blob([im.slice()],{type:im[0]==0x89?'image/png':'image/jpeg'})}}}catch(e){}return r}
const dur=f=>new Promise(r=>{const a=new Audio(),u=URL.createObjectURL(f);a.preload='metadata';const d=x=>{URL.revokeObjectURL(u);r(x)};a.onloadedmetadata=()=>d(a.duration);a.onerror=()=>d(0);a.src=u;setTimeout(()=>d(0),6000)});
function mk(x){const s={...x};if(x.cover)s.cu=URL.createObjectURL(x.cover);return s}
function index(){S.sort((a,b)=>a.title.localeCompare(b.title,'pt'));byId={};S.forEach(s=>byId[s.id]=s)}
async function load(){await idb();S=(await dbAll()).map(mk);index();render()}
async function add(files){if(!files.length)return;toast('Lendo músicas…');let n=0;
for(const f of files){const id=f.name+'|'+f.size+'|'+f.lastModified;if(byId[id])continue;
const t=await tags(f),base=f.name.replace(/\.[^.]+$/,'');let ar=t.artist,ti=t.title;
if(!ti&&base.includes(' - ')){const k=base.split(' - ');ar=ar||k[0].trim();ti=k.slice(1).join(' - ').trim()}
const x={id,file:f,title:ti||base,artist:ar||'Artista desconhecido',album:t.album||'Álbum desconhecido',cover:t.cover||null,dur:await dur(f)};
dbPut(x);const s=mk(x);S.push(s);byId[id]=s;n++;if(n%5==0){index();render()}}
index();render();toast(n?n+' música(s) adicionada(s)':'Nenhuma música nova')}
function toast(m){let e=$('toast');if(!e){e=document.createElement('div');e.id='toast';e.style.cssText='position:fixed;left:50%;top:calc(var(--sa) + 14px);transform:translateX(-50%);background:#fff;color:#000;padding:9px 16px;border-radius:99px;z-index:20;font-weight:600;transition:opacity .3s';document.body.appendChild(e)}
e.textContent=m;e.style.opacity=1;clearTimeout(e.t);e.t=setTimeout(()=>e.style.opacity=0,2200)}
/* ---------- views ---------- */
const cov=s=>`<div class="cv">${s&&s.cu?`<img loading="lazy" src="${s.cu}">`:ic('note')}</div>`;
const row=(s,l)=>`<div class="song ${cur()&&cur().id==s.id?'on':''}" data-play="${esc(s.id)}" data-l="${l}"><div class="cv" style="width:48px;height:48px">${s.cu?`<img loading="lazy" src="${s.cu}">`:ic('note')}</div><div class="i"><div class="t n">${cur()&&cur().id==s.id?'<span class="eq"><i></i><i></i><i></i></span>':''}${esc(s.title)}</div><div class="t sub">${esc(s.artist)} · ${esc(s.album)}</div></div><span class="sub">${fmt(s.dur)}</span><button data-add="${esc(s.id)}" style="color:var(--s)">${ic('dots')}</button></div>`;
const grp=k=>{const m={};S.forEach(s=>(m[s[k]]=m[s[k]]||[]).push(s));return Object.entries(m).sort((a,b)=>a[0].localeCompare(b[0],'pt'))};
const gcard=(k,n,l,r)=>`<div class="card ${r?'r':''}" data-g="${k}" data-k="${esc(n)}">${cov(l[0]).replace('class="cv"','class="cv" style="'+(r?'border-radius:50%':'')+'"')}<div class="t">${esc(n)}</div><div class="sub t">${l.length} música${l.length>1?'s':''}</div></div>`;
let LISTS=[];const reg=l=>{LISTS.push(l);return LISTS.length-1};
function list(l){const i=reg(l);return l.map(s=>row(s,i)).join('')}
function empty(){return `<div class="empty">${ic('note').replace('<svg','<svg style="width:56px;height:56px;margin-bottom:12px"')}<p style="color:#fff;font-size:18px;margin-bottom:6px">Sua biblioteca está vazia</p><p>Adicione músicas do armazenamento do seu celular.</p><div class="btn" data-pick>Adicionar músicas</div></div>`}
function greet(){const h=new Date().getHours();return h<5?'Boa madrugada':h<12?'Bom dia':h<18?'Boa tarde':'Boa noite'}
function view(){LISTS=[];
if(sub){let l,n;if(sub.g=='fav'){l=S.filter(s=>st.fav.includes(s.id));n='Músicas favoritas'}else if(sub.g=='pl'){l=(st.pl[sub.k]||[]).map(i=>byId[i]).filter(Boolean);n=sub.k}else{l=S.filter(s=>s[sub.g]==sub.k);n=sub.k}
return `<div class="row2" style="margin-bottom:14px"><button data-back>${ic('back')}</button>${sub.g=='pl'?`<button data-del class="sub">Excluir</button>`:''}</div><h1>${esc(n)}</h1><div class="sub" style="margin:-10px 0 14px">${l.length} músicas</div>${l.length?`<div class="btn" data-all="${reg(l)}">▶ Tocar tudo</div> <div class="btn g" data-shuf="${reg(l)}">Aleatório</div>`:''}${l.length?list(l):'<div class="empty">Nada por aqui ainda.</div>'}`}
if(tab=='home'){if(!S.length)return `<h1>${greet()}</h1>`+empty();
const rc=st.rec.map(i=>byId[i]).filter(Boolean).slice(0,12),al=grp('album'),ar=grp('artist'),sg=S.slice(0,20),a=reg(sg),b=reg(rc);
return `<h1>${greet()}</h1>${rc.length?`<h2>Tocadas recentemente</h2><div class="hs">${rc.map((s,i)=>`<div class="card" data-play="${esc(s.id)}" data-l="${b}">${cov(s).replace('class="cv"','class="cv" style="width:100%;aspect-ratio:1;border-radius:6px;margin-bottom:8px"')}<div class="t">${esc(s.title)}</div><div class="sub t">${esc(s.artist)}</div></div>`).join('')}</div>`:''}
<h2>Suas músicas</h2><div class="hs">${sg.map(s=>`<div class="card" data-play="${esc(s.id)}" data-l="${a}">${cov(s).replace('class="cv"','class="cv" style="width:100%;aspect-ratio:1;border-radius:6px;margin-bottom:8px"')}<div class="t">${esc(s.title)}</div><div class="sub t">${esc(s.artist)}</div></div>`).join('')}</div>
<h2>Álbuns</h2><div class="hs">${al.slice(0,15).map(([n,l])=>gcard('album',n,l)).join('')}</div>
<h2>Artistas</h2><div class="hs">${ar.slice(0,15).map(([n,l])=>gcard('artist',n,l,1)).join('')}</div>`}
if(tab=='search'){const k=q.toLowerCase(),r=k?S.filter(s=>(s.title+' '+s.artist+' '+s.album).toLowerCase().includes(k)):[];
return `<h1>Buscar</h1><input type="search" id="q" placeholder="Música, artista ou álbum" value="${esc(q)}" autocomplete="off"><div id="res">${k?(r.length?list(r):'<div class="empty">Nenhum resultado.</div>'):'<div class="empty">Encontre suas músicas locais.</div>'}</div>`}
if(tab=='lib'){let h=`<div class="row2"><h1>Biblioteca</h1><span style="display:flex"><button data-pick style="padding:8px">${ic('plus')}</button></span></div><div class="chips">${[['m','Músicas'],['al','Álbuns'],['ar','Artistas']].map(([k,n])=>`<div class="chip ${libTab==k?'a':''}" data-lt="${k}">${n}</div>`).join('')}</div>`;
if(!S.length)return h+empty();
if(libTab=='m'){h+=`<div class="chips">${[['t','A–Z'],['ar','Artista'],['al','Álbum']].map(([k,n])=>`<div class="chip ${sort==k?'a':''}" data-st="${k}">${n}</div>`).join('')}</div>`;
const l=[...S].sort((a,b)=>sort=='t'?a.title.localeCompare(b.title,'pt'):sort=='ar'?a.artist.localeCompare(b.artist,'pt')||a.title.localeCompare(b.title,'pt'):a.album.localeCompare(b.album,'pt')||a.title.localeCompare(b.title,'pt'));return h+list(l)}
const g=libTab=='al'?grp('album'):grp('artist');return h+`<div class="grid">${g.map(([n,l])=>gcard(libTab=='al'?'album':'artist',n,l,libTab=='ar')).join('')}</div>`}
const fv=S.filter(s=>st.fav.includes(s.id)).length;
return `<div class="row2"><h1>Playlists</h1><button data-new style="padding:8px">${ic('plus')}</button></div>
<div class="song" data-g="fav" data-k="fav"><div class="cv" style="width:56px;height:56px;border-radius:6px;color:#fff">${ic('heart').replace('<svg','<svg class="f"')}</div><div class="i"><div class="n">Músicas favoritas</div><div class="sub">${fv} músicas</div></div></div>
${Object.entries(st.pl).map(([n,ids])=>`<div class="song" data-g="pl" data-k="${esc(n)}"><div class="cv" style="width:56px;height:56px;border-radius:6px">${ids[0]&&byId[ids[0]]&&byId[ids[0]].cu?`<img src="${byId[ids[0]].cu}">`:ic('list')}</div><div class="i"><div class="n t">${esc(n)}</div><div class="sub">${ids.length} músicas</div></div></div>`).join('')}
${Object.keys(st.pl).length?'':'<div class="empty">Crie sua primeira playlist com o botão +</div>'}`}
function render(){const m=$('main'),y=m.scrollTop;m.innerHTML=view();m.scrollTop=y;nav()}
function nav(){$('nav').innerHTML=[['home','Início','home'],['search','Buscar','search'],['lib','Biblioteca','lib'],['pls','Playlists','list']].map(([k,n,i])=>`<button data-tab="${k}" class="${tab==k?'a':''}">${ic(i)}${n}</button>`).join('')}
/* ---------- player ---------- */
const cur=()=>byId[Q[X]];
function go(i,l){Q=l.map(s=>s.id);X=i;start()}
function start(){const s=cur();if(!s)return;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(s.file);au.src=url;au.play().catch(()=>{});
st.rec=[s.id,...st.rec.filter(i=>i!=s.id)].slice(0,30);save();meta();ui();if(tab=='home'&&!sub){} else if(!$('full').classList.contains('o'))refreshRows()}
function refreshRows(){document.querySelectorAll('.song[data-play]').forEach(e=>{const on=cur()&&e.dataset.play==cur().id;e.classList.toggle('on',on);const n=e.querySelector('.n'),eq=n.querySelector('.eq');if(on&&!eq)n.insertAdjacentHTML('afterbegin','<span class="eq"><i></i><i></i><i></i></span>');if(!on&&eq)eq.remove()})}
function next(auto){if(!Q.length)return;if(rep==2&&auto){au.currentTime=0;au.play();return}
if(shuf&&Q.length>1){let i;do i=Math.floor(Math.random()*Q.length);while(i==X);X=i}else if(X+1<Q.length)X++;else if(rep==1||!auto)X=0;else{au.pause();return}start()}
function prev(){if(au.currentTime>3||!Q.length){au.currentTime=0;return}X=X>0?X-1:Q.length-1;start()}
const tog=()=>{if(!cur())return;au.paused?au.play():au.pause()};
function ui(){const s=cur(),pl=!au.paused;$('mini').classList.toggle('h',!s);if(!s)return;
$('mc').innerHTML=s.cu?`<img src="${s.cu}">`:ic('note');$('fcv').innerHTML=s.cu?`<img src="${s.cu}">`:ic('note').replace('<svg','<svg style="width:90px;height:90px"');
$('mi').innerHTML=`<div class="t n" style="font-weight:600">${esc(s.title)}</div><div class="t sub">${esc(s.artist)}</div>`;
$('ft').textContent=s.title;$('fa').textContent=s.artist+' · '+s.album;
const f=st.fav.includes(s.id);$('mf').innerHTML=ic('heart',f);$('ff').innerHTML=ic('heart',f);
$('mp').innerHTML=ic(pl?'pause':'play',1);$('fp').innerHTML=ic(pl?'pause':'play',1);$('full').classList.toggle('pa',!pl);
$('sh').className=shuf?'a':'';$('rp').className=rep?'a':'';$('rp').innerHTML=ic('repeat')+(rep==2?'<span style="font-size:9px;position:absolute;margin-top:2px">1</span>':'')}
function meta(){const s=cur();if(!s||!('mediaSession' in navigator))return;
navigator.mediaSession.metadata=new MediaMetadata({title:s.title,artist:s.artist,album:s.album,artwork:s.cu?[{src:s.cu,sizes:'512x512',type:s.cover.type}]:[]})}
if('mediaSession' in navigator){const m=navigator.mediaSession;[['play',()=>au.play()],['pause',()=>au.pause()],['previoustrack',prev],['nexttrack',()=>next()],['seekto',e=>{au.currentTime=e.seekTime}]].forEach(([a,f])=>{try{m.setActionHandler(a,f)}catch(e){}})}
au.onplay=au.onpause=()=>{ui();if('mediaSession' in navigator)navigator.mediaSession.playbackState=au.paused?'paused':'playing'};
au.onended=()=>next(true);
au.ontimeupdate=()=>{const d=au.duration||0,t=au.currentTime;if(!d)return;$('mb').style.width=t/d*100+'%';
if(!drag){const v=t/d*1000;$('seek').value=v;$('seek').style.setProperty('--p',v/10+'%');$('tc').textContent=fmt(t)}$('td').textContent=fmt(d);
try{navigator.mediaSession.setPositionState({duration:d,position:t,playbackRate:1})}catch(e){}};
$('seek').oninput=e=>{drag=true;const v=e.target.value;e.target.style.setProperty('--p',v/10+'%');$('tc').textContent=fmt(v/1000*(au.duration||0))};
$('seek').onchange=e=>{au.currentTime=e.target.value/1000*(au.duration||0);drag=false};
$('vol').oninput=e=>{au.volume=e.target.value/100;e.target.style.setProperty('--p',e.target.value+'%')};$('vol').style.setProperty('--p','100%');
$('vi').innerHTML=ic('note').replace('<svg','<svg style="width:18px;height:18px"');
$('fc').innerHTML=ic('down');$('fq').innerHTML=ic('list');$('sh').innerHTML=ic('shuffle');$('pv').innerHTML=ic('prev',1);$('nx').innerHTML=ic('next',1);
$('mp').onclick=e=>{e.stopPropagation();tog()};$('fp').onclick=tog;$('pv').onclick=prev;$('nx').onclick=()=>next();
$('sh').onclick=()=>{shuf=!shuf;ui()};$('rp').onclick=()=>{rep=(rep+1)%3;ui()};
$('mf').onclick=e=>{e.stopPropagation();fav()};$('ff').onclick=fav;$('fq').onclick=()=>cur()&&sheet(cur().id);
$('mini').onclick=()=>$('full').classList.add('o');$('fc').onclick=()=>{$('full').classList.remove('o');refreshRows()};
function fav(){const s=cur();if(!s)return;const i=st.fav.indexOf(s.id);i<0?st.fav.push(s.id):st.fav.splice(i,1);save();ui();if(sub&&sub.g=='fav'||tab=='pls')render()}
/* ---------- playlists ---------- */
function sheet(id){const h=`<div><div class="row2" style="margin-bottom:8px"><b style="font-size:18px">Adicionar à playlist</b><button data-x>${ic('down')}</button></div>
<div class="song" data-np="${esc(id)}"><div class="cv" style="width:48px;height:48px">${ic('plus')}</div><div class="i">Nova playlist</div></div>
<div class="song" data-fv="${esc(id)}"><div class="cv" style="width:48px;height:48px">${ic('heart',st.fav.includes(id))}</div><div class="i">${st.fav.includes(id)?'Remover dos favoritos':'Favoritar'}</div></div>
${Object.entries(st.pl).map(([n,ids])=>`<div class="song" data-ap="${esc(n)}" data-id="${esc(id)}"><div class="cv" style="width:48px;height:48px">${ic('list')}</div><div class="i"><div class="t">${esc(n)}</div><div class="sub">${ids.includes(id)?'Já está nesta playlist':ids.length+' músicas'}</div></div></div>`).join('')}</div>`;
$('sheet').innerHTML=h;$('sheet').classList.add('o')}
function newPl(id){const n=(prompt('Nome da playlist')||'').trim();if(!n)return;if(!st.pl[n])st.pl[n]=[];if(id&&!st.pl[n].includes(id))st.pl[n].push(id);save();$('sheet').classList.remove('o');render();toast('Playlist “'+n+'” pronta')}
/* ---------- events ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab],[data-play],[data-add],[data-g],[data-back],[data-pick],[data-lt],[data-st],[data-all],[data-shuf],[data-new],[data-del],[data-np],[data-ap],[data-fv],[data-x]');if(!t||t.closest('#full')&&!t.closest('#sheet'))return;
const d=t.dataset;
if(d.tab){tab=d.tab=='pls'?'pls':d.tab;sub=null;$('main').scrollTop=0;render();return}
if('pick' in d){$('pick').click();return}
if(d.add){e.stopPropagation();sheet(d.add);return}
if(d.play){const l=LISTS[d.l];go(l.findIndex(s=>s.id==d.play),l);if(!$('main').querySelector('.hs'))refreshRows();return}
if(d.g){sub={g:d.g,k:d.k};$('main').scrollTop=0;render();return}
if('back' in d){sub=null;render();return}
if(d.lt){libTab=d.lt;render();return}if(d.st){sort=d.st;render();return}
if(d.all){go(0,LISTS[d.all]);return}
if(d.shuf){shuf=true;const l=LISTS[d.shuf];go(Math.floor(Math.random()*l.length),l);return}
if('new' in d){newPl();return}
if('del' in d){if(confirm('Excluir esta playlist?')){delete st.pl[sub.k];save();sub=null;render()}return}
if(d.np){newPl(d.np);return}
if(d.fv){const i=st.fav.indexOf(d.fv);i<0?st.fav.push(d.fv):st.fav.splice(i,1);save();$('sheet').classList.remove('o');ui();render();return}
if(d.ap){const a=st.pl[d.ap];if(!a.includes(d.id))a.push(d.id);save();$('sheet').classList.remove('o');render();toast('Adicionada a “'+d.ap+'”');return}
if('x' in d)$('sheet').classList.remove('o')});
$('sheet').addEventListener('click',e=>{if(e.target.id=='sheet')$('sheet').classList.remove('o')});
document.addEventListener('input',e=>{if(e.target.id=='q'){q=e.target.value;const k=q.toLowerCase();LISTS=[];const r=k?S.filter(s=>(s.title+' '+s.artist+' '+s.album).toLowerCase().includes(k)):[];$('res').innerHTML=k?(r.length?list(r):'<div class="empty">Nenhum resultado.</div>'):'<div class="empty">Encontre suas músicas locais.</div>'}});
$('pick').onchange=e=>{add([...e.target.files]);e.target.value=''};
document.addEventListener('keydown',e=>{if(e.code=='Space'&&e.target.tagName!='INPUT'){e.preventDefault();tog()}});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});load();ui();
</script></body></html>
